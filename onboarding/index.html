<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Up Your Bot — Viksit Analyst</title>
<meta name="description" content="Complete your Viksit Analyst onboarding — connect your broker, allocate your strategy, and activate your trading bot.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.viksitanalyst.com/onboarding.html">
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#0B1F3A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="onboarding.css">
</head>

<body>
<noscript><style>.mobile-drawer { display: none; } #obShell { display: none; }</style></noscript>
<a href="#main" class="skip-link">Skip to main content</a>

<!-- ================================ HEADER =================================== -->
<header class="nav" id="siteNav">
  <div class="container nav-inner">
    <a href="index.html" class="brand" aria-label="Viksit Analyst home">
      <svg class="brand-mark" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 15L8 8L13 12L21 4L31 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="4" r="2.5"/>
      </svg>
      Viksit Analyst
    </a>
    <nav class="nav-links" aria-label="Primary">
      <span class="mono" style="font-size:var(--fs-xs);color:var(--text-tertiary);padding:10px 16px;">Guided Setup</span>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" type="button">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke-linejoin="round"/></svg>
      </button>
      <a href="contact.html" class="btn btn-ghost">Need Help?</a>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" type="button"><span></span></button>
    </div>
  </div>
  <div class="mobile-drawer" id="mobileDrawer">
    <a href="contact.html">Need Help?</a>
  </div>
</header>

<main id="main" class="onboarding-main">
  <div class="onboarding-shell">

    <div class="ob-progress-meta" id="obProgressMeta">
      <span>Setup Progress</span>
      <span class="ob-progress-pct mono" id="obProgressPct">0%</span>
    </div>

    <div class="ob-stepper" id="obStepper" role="list" aria-label="Onboarding steps"></div>

    <div id="obShell">
      <div class="ob-panel" id="obPanel" aria-live="polite">
        <div class="ob-skeleton" style="height:28px;width:50%;margin-bottom:12px;"></div>
        <div class="ob-skeleton" style="height:16px;width:70%;margin-bottom:32px;"></div>
        <div class="ob-skeleton" style="height:200px;width:100%;"></div>
      </div>

      <div class="ob-panel-footer" style="border-top:none;">
        <div class="ob-footer-left">
          <button type="button" class="btn btn-secondary" id="obPrevBtn" style="visibility:hidden;">Back</button>
        </div>
        <button type="button" class="btn btn-primary btn-lg" id="obNextBtn">Continue</button>
      </div>
    </div>

  </div>
</main>

<!-- Required on every page that loads script.js unmodified: modalClose/
     modalOverlay listeners are unguarded, so this markup must exist even
     though onboarding.html never triggers [data-strategy-open]. Matches
     index.html/contact.html/etc. verbatim. -->
<div class="modal-overlay" id="strategyModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal" id="modalContent">
    <button class="modal-close" id="modalClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ============================ CONFIRM DIALOG ================================ -->
<div class="modal-overlay" id="obConfirmOverlay" role="dialog" aria-modal="true" aria-labelledby="obConfirmTitle">
  <div class="modal" id="obConfirmContent" style="max-width:420px;">
    <button class="modal-close" id="obConfirmClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </button>
    <div id="obConfirmBody"><!-- populated by components/confirmDialog.js --></div>
  </div>
</div>

<!-- Toast region — see components/toast.js -->
<div class="ob-toast-region" id="obToastRegion" role="status" aria-live="polite"></div>

<script src="../script.js"></script>
<script type="module" src="onboarding.js"></script>
</body>
</html>
